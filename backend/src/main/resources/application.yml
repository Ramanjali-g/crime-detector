spring:
  config:
    import: optional:file:.env[.properties]
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/crime_detector}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}
  upload:
    dir: ${UPLOAD_DIR:uploads}
  seed:
    demo-password: ${SEED_DEMO_PASSWORD:}

logging:
  level:
    org.springframework.boot.autoconfigure.security: WARN
